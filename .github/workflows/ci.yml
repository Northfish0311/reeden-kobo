name: CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Zig 0.13.0
        run: |
          curl -fL --retry 3 https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Build ARMHF host and verify deterministic prebuilt hashes
        run: |
          (cd prebuilt && sha256sum -c PREBUILT_SHA256SUMS)
          ZIG=/tmp/zig-linux-x86_64-0.13.0/zig sh scripts/build.sh
          ZIG=/tmp/zig-linux-x86_64-0.13.0/zig sh scripts/build-headless.sh
          cmp -s package/bin/fb-guard prebuilt/bin/fb-guard
          cmp -s package/bin/reeden-kindle prebuilt/bin/reeden-kindle
          cmp -s package/lib/libreeden_kobo_compat.so prebuilt/lib/libreeden_kobo_compat.so
          for f in prebuilt/checks/*-armhf; do
            cmp -s "build/$(basename "$f")" "$f"
          done
          rm -rf build package

      - name: Run C and Python unit tests
        run: |
          mkdir -p build
          for test_src in \
            "tests/codec_test.c src/codec.c" \
            "tests/light_panel_test.c src/light_panel.c" \
            "tests/refresh_policy_test.c src/refresh_policy.c"
          do
            name=$(echo "$test_src" | awk '{print $1}' | xargs basename -s .c)
            cc -O2 -Wall -Wextra -Werror -Iinclude -Isrc $test_src -lm -o "build/${name}-host"
            "./build/${name}-host"
          done
          for py_test in tests/*.py; do
            python3 "$py_test"
          done
          rm -rf build

      - name: Package One-Click Release Archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          OUT="Reeden-Kobo-Adapter-${TAG}-OneClick.zip"
          git archive --format=zip --prefix="reeden-kobo/" -o "$OUT" HEAD
          sha256sum "$OUT" > "${OUT}.sha256"

      - name: Upload GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Reeden-Kobo-Adapter-*.zip
            Reeden-Kobo-Adapter-*.zip.sha256
