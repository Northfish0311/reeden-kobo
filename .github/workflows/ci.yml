name: CI & Release

on:
  push:
    # Every branch, not just main: feature branches such as improve/usb-preflight used to
    # get no CI at all until they reached a pull request.
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run installer, recovery and security regressions
        run: |
          for test in tests/*.py; do python3 "$test"; done

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Zig 0.13.0
        run: |
          curl -fL --retry 3 https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          echo 'd45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  /tmp/zig.tar.xz' | sha256sum -c -
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo '/tmp/zig-linux-x86_64-0.13.0' >> "$GITHUB_PATH"
      - name: Rebuild ARMHF artifacts and compare every prebuilt
        run: |
          (cd prebuilt && sha256sum -c PREBUILT_SHA256SUMS)
          ZIG=zig sh scripts/build.sh
          ZIG=zig sh scripts/build-headless.sh
          cmp package/bin/fb-guard prebuilt/bin/fb-guard
          cmp package/bin/reeden-kindle prebuilt/bin/reeden-kindle
          cmp package/lib/libreeden_kobo_compat.so prebuilt/lib/libreeden_kobo_compat.so
          for f in prebuilt/checks/*-armhf; do cmp "build/$(basename "$f")" "$f"; done
      - name: Run Linux C regressions
        run: |
          for sources in \
            'tests/codec_test.c src/codec.c' \
            'tests/light_panel_test.c src/light_panel.c' \
            'tests/refresh_policy_test.c src/refresh_policy.c' \
            'tests/input_test.c src/input.c' \
            'tests/power_worker_test.c src/power_worker.c' \
            'tests/cover_test.c' \
            'tests/system_panel_test.c src/system_panel.c' \
            'tests/display_transaction_test.c src/refresh_policy.c src/turn_timing.c src/frame_evidence.c' \
            'tests/turn_timing_test.c src/turn_timing.c src/refresh_policy.c' \
            'tests/frame_evidence_test.c src/frame_evidence.c'
          do
            name=$(echo "$sources" | awk '{print $1}' | xargs basename -s .c)
            zig cc -D_GNU_SOURCE= -O2 -Wall -Wextra -Werror -Wno-unused-parameter -Iinclude -Isrc $sources -lpthread -lm -o "build/${name}-host"
            "build/${name}-host"
          done
      - name: Run ARMHF synthetic input and display tests under QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user libc6-armhf-cross
          qemu-arm -L /usr/arm-linux-gnueabihf build/input-test-armhf
          qemu-arm -L /usr/arm-linux-gnueabihf build/codec-test-armhf
          qemu-arm build/refresh-policy-test-armhf
          qemu-arm build/display-transaction-test-armhf
          zig cc -target arm-linux-musleabihf -static -mcpu=cortex_a7 -O2 -Wall -Wextra -Werror -Isrc tests/cover_test.c -o build/cover-test-armhf
          qemu-arm build/cover-test-armhf
          zig cc -target arm-linux-musleabihf -static -mcpu=cortex_a7 -O2 -Wall -Wextra -Werror -Iinclude -Isrc tests/system_panel_test.c src/system_panel.c -lpthread -lm -o build/system-panel-test-armhf
          qemu-arm build/system-panel-test-armhf

  usb-tools:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the Apple Silicon baseline explicit instead of following latest.
        os: [ubuntu-latest, macos-15, windows-latest]
    # Reuse each runner for both interpreters: arm64 macOS capacity is limited.
    # All six platform/interpreter combinations still gate publication.
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # The read-only evidence audit anchors its baseline to the .4 tag.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test simulated USB installation and removal (Python 3.10)
        shell: bash
        run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 10), sys.version'
          python tests/oneclick_installer_test.py
          python tests/usb_preflight_test.py
          python tests/update_flow_test.py
          python tests/uninstall_test.py
          python tests/archive_security_test.py
          python tests/official_core_test.py
          python tests/device_uninstall_test.py
          python tests/desktop_launcher_test.py
          python install.py --help
          python uninstall.py --help

      - name: Run read-only evidence regressions on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python tools/acceptance/regression/build_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/acceptance/regression/audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tools/acceptance/regression/run-regression.ps1 -RunTag ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test simulated USB installation and removal (Python 3.12)
        shell: bash
        run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python tests/oneclick_installer_test.py
          python tests/usb_preflight_test.py
          python tests/update_flow_test.py
          python tests/uninstall_test.py
          python tests/archive_security_test.py
          python tests/official_core_test.py
          python tests/device_uninstall_test.py
          python tests/desktop_launcher_test.py
          python install.py --help
          python uninstall.py --help

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        # A broken launcher or power helper only shows up on the device, where every
        # recover cycle costs a reboot; catch it here in seconds.
        # tools/*.sh 是设备侧诊断脚本（例如接设备第一步跑的输入设备枚举），
        # 同样只会在真机上暴露语法错误，一并纳入门禁。
        run: |
          for script in scripts/*.sh tools/*.sh; do
            [ -e "$script" ] || continue
            echo "checking $script"
            sh -n "$script" || exit 1
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, verify, usb-tools, scripts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package the exact tagged commit
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir release-files
          git archive --format=zip --prefix=reeden-kobo/ -o "release-files/Reeden-Kobo-Adapter-${TAG}-OneClick.zip" HEAD
          git archive --format=zip -o "release-files/Reeden-Kobo-${TAG}-Source.zip" HEAD
          printf '%s\n' "$(git rev-parse HEAD)" > release-files/COMMIT.txt
          (cd release-files && sha256sum *.zip COMMIT.txt > SHA256SUMS)
      - name: Verify archives before publication
        run: |
          python3 - <<'PY'
          import ast, hashlib, os, pathlib, subprocess, zipfile
          tag = os.environ['GITHUB_REF_NAME']
          root = pathlib.Path('release-files')
          source = root / f'Reeden-Kobo-{tag}-Source.zip'
          oneclick = root / f'Reeden-Kobo-Adapter-{tag}-OneClick.zip'
          def contents(path, prefix):
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None, 'ZIP CRC failure'
                  files = [i for i in z.infolist() if not i.is_dir()]
                  assert all(i.filename.startswith(prefix) for i in files)
                  names = [i.filename[len(prefix):] for i in files]
                  assert len(names) == len(set(names)), 'duplicate paths'
                  return {name: hashlib.sha256(z.read(i)).hexdigest() for name, i in zip(names, files)}
          assert contents(source, '') == contents(oneclick, 'reeden-kobo/'), 'archive contents differ'
          with zipfile.ZipFile(source) as z:
              tree = ast.parse(z.read('install.py').decode('utf-8'))
              version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'PORT_VERSION' for t in n.targets))
              assert tag == 'v' + version, 'installer version mismatch'
              assert f'docs/releases/{tag}.md' in z.namelist(), 'missing release notes'
          assert (root / 'COMMIT.txt').read_text().strip() == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          print('PASS: matching ZIP contents, installer version, release notes, commit and SHA256SUMS')
          PY
      - name: Publish experimental release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          name: Reeden Kobo ${{ github.ref_name }} (Experimental)
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release-files/*
          fail_on_unmatched_files: true
